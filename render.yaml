# ============================================================
# JanSetu – Render Blueprint (Free web service)
# Deploy: "New +" > "Blueprint" > select this repo.
# ============================================================
services:
  - type: web
    name: jansetu
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false            # set a strong value in the Render dashboard
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false            # set your admin password in the Render dashboard
      - key: SUPABASE_URL
        sync: false            # your Supabase project URL
      - key: SUPABASE_SERVICE_KEY
        sync: false            # your Supabase service_role key
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: GEMINI_API_KEY
        sync: false